# openspec/config.yaml
schema: spec-driven

# Project context — detected by sdd-init, kept under 10 lines.
context: |
  Tech stack: Go 1.26.2 (toolchain go1.26.4); stdlib net/http; SQLite via modernc.org/sqlite (pure Go, no CGO); database/sql; html/template; HTMX 2.0.4 (web/templates).
  Architecture: layered — internal/domain (empleado, estimulo, incentivo, nudge, perfil_map, umbral) → internal/engine (calibrador, detector_riesgo, elegibilidad, recomendador, analisis) → internal/service → internal/handler → internal/store/sqlite (migrations) → cmd/server; views in web/templates.
  Testing: Go stdlib testing; unit tests in internal/engine (9 tests, 46.0% coverage); httptest available for handlers; SQLite store tests skippable via testing.Short().
  Style: domain entities named in Spanish (matching existing code); generated technical artifacts in English; table-driven tests per go-testing skill; gofmt/go vet clean expectations.
  Persistence: hybrid (openspec/ files + Engram observations), artifact_store.mode = both. Project is NOT a git repo yet — SDD artifacts live on the filesystem until git init.

# Strict TDD resolution: no marker/config existed → test runner detected → default true.
strict_tdd: true

# Testing capabilities cache — detected 2026-08-03 by sdd-init.
testing:
  runner: go test
  command: go test ./...
  layers:
    unit:
      available: true
      command: go test ./internal/engine/
    integration:
      available: true
      command: go test ./...  # handlers via httptest, sqlite store in-memory/temp
    e2e:
      available: false
      command: null
  coverage:
    available: true
    command: go test -cover ./...
    current: "internal/engine: 46.0%"
  quality:
    linter:
      available: true
      command: go vet ./...
    type_checker:
      available: true
      command: go build ./...  # Go compiler is the type checker
    formatter:
      available: true
      command: gofmt -l .

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the affected domain entities in internal/domain
    - Note when a change needs new SQLite migrations (internal/store/sqlite/migrations)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep Spanish domain terms consistent with existing code (Umbral, PerfilMAP, Estimulo, Incentivo, Nudge)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect the layered boundaries: domain → engine → service → handler → store (no layer skipping)
    - Stay CGO-free: modernc.org/sqlite only
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Each task must map to a spec requirement and a test
  apply:
    guidelines:
      - Follow existing code patterns
      - Keep Spanish domain vocabulary in code identifiers
      - Do not mutate app code outside the approved change scope
    tdd: true
    test_command: go test ./...
  verify:
    test_command: go test ./...
    build_command: go build ./...
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
