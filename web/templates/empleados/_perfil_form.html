<div class="form-inline" id="perfil-edit-form">
    <h3>Editar Perfil MAP</h3>
    <form hx-put="/api/empleados/{{.Perfil.EmpleadoID}}/perfil" hx-ext="json-enc" hx-target="closest .card" hx-swap="outerHTML">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Motivación (0.0 - 1.0)</label>
                <input class="form-input" type="number" name="motivacion" min="0" max="1" step="0.01" value="{{printf "%.2f" .Perfil.Motivacion}}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Habilidad (0.0 - 1.0)</label>
                <input class="form-input" type="number" name="habilidad" min="0" max="1" step="0.01" value="{{printf "%.2f" .Perfil.Habilidad}}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Prompt (0.0 - 1.0)</label>
                <input class="form-input" type="number" name="prompt" min="0" max="1" step="0.01" value="{{printf "%.2f" .Perfil.Prompt}}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Sensibilidad</label>
                <select class="form-select" name="sensibilidad" required>
                    <option value="economico" {{if eq .Perfil.Sensibilidad "economico"}}selected{{end}}>Económico</option>
                    <option value="reconocimiento" {{if eq .Perfil.Sensibilidad "reconocimiento"}}selected{{end}}>Reconocimiento</option>
                    <option value="desarrollo" {{if eq .Perfil.Sensibilidad "desarrollo"}}selected{{end}}>Desarrollo</option>
                    <option value="bienestar" {{if eq .Perfil.Sensibilidad "bienestar"}}selected{{end}}>Bienestar</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Confiabilidad (0.0 - 1.0)</label>
                <input class="form-input" type="number" name="confiabilidad" min="0" max="1" step="0.01" value="{{printf "%.2f" .Perfil.Confiabilidad}}">
            </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button type="button" class="btn" onclick="this.closest('#perfil-edit-form').remove()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
        </div>
    </form>
</div>
