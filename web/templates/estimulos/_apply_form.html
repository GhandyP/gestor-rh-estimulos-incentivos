<div class="form-inline" id="apply-form">
    <h3>✅ Aplicar Estímulo</h3>
    <p style="color:var(--muted);font-size:0.88rem;margin-bottom:12px">
        Registrá la respuesta observada del empleado a este estímulo (0.0 = sin efecto, 1.0 = máximo efecto).
    </p>
    <form hx-post="/api/estimulos/{{.Estimulo.ID}}/aplicar" hx-ext="json-enc"
          hx-target="#apply-form"
          hx-swap="outerHTML">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Respuesta MAP observada (0.0 - 1.0)</label>
                <input class="form-input" type="number" name="respuesta" min="0" max="1" step="0.01" value="0.5" required>
            </div>
        </div>
        <div style="display:flex;gap:10px">
            <button type="submit" class="btn btn-success">Confirmar Aplicación</button>
            <button type="button" class="btn" onclick="this.closest('#apply-form').remove()">Cancelar</button>
        </div>
    </form>
</div>
